# ───────────────────────────── cloud AI / ML exposure ─────────────────────────────
- id: cloud-ml-notebooks
  name: Managed notebooks / ML workbenches with direct internet access or public endpoints (SageMaker, Vertex AI Workbench, Azure ML compute, Databricks)
  provider: multi
  family: ai
  weight: high
  agent_expected: false
  risk: "Notebook = shell with a powerful role. Presigned notebook URLs leaked in chat or tickets give direct access."
  discover: ["*.notebook.<region>.sagemaker.aws, *.notebooks.googleusercontent.com, *.azureml.ms, *.cloud.databricks.com links in tickets and repos"]
  proof: {rung: E2, cmd: "curl -s -o /dev/null -w '%{http_code}' <notebook-url>", exposed_if: "Notebook UI reachable without SSO redirect (presigned URLs: check expiry offline)"}
  inside_out: "aws sagemaker list-notebook-instances; aws sagemaker describe-notebook-instance --notebook-instance-name <n> --query '[DirectInternetAccess,RootAccess]'; az ml compute list -g <rg> -w <ws>; gcloud workbench instances list --location europe-west2-a"
  attack: {access: [T1078.004, T1190], follow_on: [T1059.006, T1552.005, T1496.001]}
  soc_watch: [DET0546, DET0080, DET0063, DET0001, DET0540]
  mitigations: [M1035, M1026, M1042]
  fix: "Disable direct internet access, use VPC-only mode, least-privilege execution roles, short presigned URL TTLs."
  guardrail: "SCP condition sagemaker:DirectInternetAccess = Disabled. Azure Policy for ML workspaces without public network access."

- id: cloud-ai-agents-exposed
