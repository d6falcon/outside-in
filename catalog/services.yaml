# outside-in :: exposed network services catalog
# ATT&CK Enterprise v20.1. Every T/DET/M ID is checked by scripts/Update-AttackMapping.ps1.
#
# Field guide
#   weight       critical | high | medium | low   -> feeds the EPS "Class" factor (25 / 20 / 10 / 3)
#   agent_expected  CLASS DEFAULT. true = the asset behind this exposure is a general-purpose host (or container node) that should
#                run your EDR / runtime sensor. A missing, stale or unknown agent lifts the finding one band (methodology s5).
#                false = appliance, BMC, hypervisor, IoT or OT where EDR can't run; rely on network and log telemetry.
#                Override per asset when the real asset differs (e.g. a managed DB behind "mysql" = not-applicable).
#   passive      Shodan-style filter. Replace <CIDR> / <ORG> / <DOMAIN>. Equivalent queries exist in Censys, FOFA,
#                ZoomEye, Netlas and ONYPHE. Translate rather than copy blindly, because syntaxes change.
#   proof        least-touch probe (needs active authorisation) + the rung on the evidence ladder it reaches
#                (docs/methodology.md section 4). "roe_gated: true" = involves default or anonymous credentials or
#                OT safety risk, so run it only if the RoE explicitly allows it; otherwise ask the owner for E4.
#   attack       techniques the exposure enables (initial access / follow-on). Recon defaults below apply to all.
#   soc_watch    ATT&CK Detection Strategies the SOC should have coverage for while the exposure is open.
#   intel        illustrative CVEs and notes. ALWAYS re-check CISA KEV + EPSS + vendor advisories live.

schema_version: 1
attack_version: "20.1"
defaults:
  recon: [T1595.001, T1595.002, T1596.005, T1590.005, T1046]   # how attackers find every entry below
  recon_watch: [DET0817, DET0867, DET0858, DET0815, DET0376]

services:

# ───────────────────────────── remote administration ─────────────────────────────
- id: rdp
  name: Remote Desktop Protocol
  family: remote-admin
  ports: ["3389/tcp", "3389/udp"]
  weight: high
  agent_expected: true
  risk: "Top ransomware entry point. Exposes a login surface for password spraying, pre-auth RCE history, and NTLM info leak (AD domain, hostname, OS build)."
  passive: "net:<CIDR> port:3389"
  proof: {rung: E2, cmd: "nmap -Pn -p3389 --script rdp-ntlm-info,rdp-enum-encryption <ip>", exposed_if: "RDP negotiation completes; record NLA/CredSSP status and the leaked NetBIOS/DNS domain"}
  attack: {access: [T1133, T1110.003, T1078.002], follow_on: [T1021.001, T1563.002, T1486]}
  soc_watch: [DET0354, DET0487, DET0210, DET0327, DET0588, DET0215]
  mitigations: [M1035, M1032, M1042, M1030, M1027]
  fix: "Remove from the internet. Publish only through ZTNA or RD Gateway with phishing-resistant MFA. Enforce NLA and account lockout."
  intel: ["CVE-2019-0708 (BlueKeep)", "Rapid7 2026: RDP is the most-advertised access type on underground forums"]

- id: ssh
  name: Secure Shell
  family: remote-admin
  ports: ["22/tcp", "2222/tcp"]
  weight: high
  agent_expected: true
  risk: "Password brute force when password auth is on. Unpatched daemons (OpenSSH, Erlang/OTP, appliance SSH) give pre-auth RCE. Banners leak OS and patch level."
  passive: "net:<CIDR> port:22"
  proof: {rung: E2, cmd: "nmap -Pn -p22 -sV --script ssh-auth-methods,ssh2-enum-algos <ip>", exposed_if: "Handshake completes; flag 'password' or 'keyboard-interactive' in auth methods and outdated versions"}
  attack: {access: [T1133, T1110.001, T1190], follow_on: [T1021.004, T1098.004]}
  soc_watch: [DET0354, DET0551, DET0080, DET0596]
  mitigations: [M1035, M1032, M1042, M1051]
  fix: "Restrict to a bastion or ZTNA. Use key-only or certificate auth, disable passwords, and patch the daemon."
  intel: ["CVE-2024-6387 (regreSSHion)", "CVE-2025-32433 (Erlang/OTP SSH pre-auth RCE, common in network and OT gear)"]

- id: telnet
  name: Telnet
  family: remote-admin
  ports: ["23/tcp", "2323/tcp"]
  weight: high
  agent_expected: false
  risk: "Cleartext credentials. Usually network gear, IoT or OT with default passwords. A favourite botnet recruitment port."
  passive: "net:<CIDR> port:23"
  proof: {rung: E2, cmd: "nmap -Pn -p23 -sV --script telnet-ntlm-info <ip>", exposed_if: "Login prompt or banner returned"}
  attack: {access: [T1133, T1078.001, T1110.001], follow_on: [T1584.005]}
  soc_watch: [DET0354, DET0465, DET0551]
  mitigations: [M1042, M1035, M1041]
  fix: "Disable Telnet and replace with SSH. Change default credentials. Move management to an out-of-band network."

- id: vnc
  name: VNC / RFB
  family: remote-admin
  ports: ["5900-5910/tcp", "5800/tcp"]
  weight: high
  agent_expected: true
  risk: "Weak or missing authentication. Often exposes HMI and OT screens or admin desktops directly."
  passive: "net:<CIDR> port:5900"
  proof: {rung: E3, cmd: "nmap -Pn -p5900-5910 --script vnc-info <ip>", exposed_if: "Security type 'None' (1) offered = unauthenticated desktop (force P1). VNC auth only = E2"}
  attack: {access: [T1133, T1110.001], follow_on: [T1021.005]}
  soc_watch: [DET0354, DET0551, DET0178]
  mitigations: [M1035, M1042, M1047]
  fix: "Remove from the internet. Tunnel over ZTNA or SSH. Enforce strong authentication. Remove unused VNC servers."

- id: winrm
  name: Windows Remote Management
  family: remote-admin
  ports: ["5985/tcp", "5986/tcp"]
  weight: high
  agent_expected: true
  risk: "Remote PowerShell. Valid credentials give direct command execution. NTLM auth exposes a spray target."
  passive: "net:<CIDR> port:5985,5986"
  proof: {rung: E2, cmd: "curl -s -o /dev/null -D - -X POST -d '' http://<ip>:5985/wsman | head -n 5; curl -sk -o /dev/null -D - -X POST -d '' https://<ip>:5986/wsman | head -n 5", exposed_if: "401 with WWW-Authenticate Negotiate/Kerberos/NTLM on /wsman = WinRM listener reachable"}
  attack: {access: [T1133, T1110.003], follow_on: [T1021.006, T1059.001]}
  soc_watch: [DET0354, DET0487, DET0477]
  mitigations: [M1035, M1042, M1030, M1026]
  fix: "Block at the perimeter. Restrict to management subnets. Use JEA endpoints."

- id: rd-web-gateway
  name: RD Web Access / RD Gateway / RDWeb
  family: remote-admin
  ports: ["443/tcp"]
  weight: high
  agent_expected: true
  risk: "Web front end to RDP. Brute-forceable without MFA. Rapid7 2026 lists RDWeb among the most-advertised access types."
  passive: "hostname:<DOMAIN> http.title:\"RD Web Access\""
  proof: {rung: E2, cmd: "curl -sk -o /dev/null -w '%{http_code}' https://<host>/RDWeb/", exposed_if: "200 or 302 to the RDWeb login page"}
  attack: {access: [T1133, T1110.003], follow_on: [T1021.001]}
  soc_watch: [DET0354, DET0487, DET0327]
  mitigations: [M1032, M1035, M1036]
  fix: "Put it behind an identity-aware proxy with phishing-resistant MFA, or retire it in favour of ZTNA."

- id: rmm-self-hosted
  name: Self-hosted RMM / remote support (ScreenConnect, etc.)
  family: remote-admin
  ports: ["8040/tcp", "8041/tcp", "443/tcp"]
  weight: critical
  agent_expected: true
  risk: "One server controls every managed endpoint. Repeated auth-bypass KEVs. Attackers also abuse legitimate RMM for persistence."
  passive: "http.title:\"ScreenConnect\" org:\"<ORG>\""
  proof: {rung: E2, cmd: "nmap -Pn -p8040,8041,443 -sV --script http-title,http-headers <ip>", exposed_if: "Product login page or server header identifies an RMM build"}
  attack: {access: [T1190, T1133], follow_on: [T1219.002, T1072, T1486]}
  soc_watch: [DET0080, DET0354, DET0259]
  mitigations: [M1051, M1035, M1032]
  fix: "Patch on the KEV timeline. Front the server with SSO and MFA. Restrict the admin console to an allow-list. Inventory any unsanctioned RMM."
  intel: ["CVE-2024-1709 (ScreenConnect auth bypass)"]

- id: r-services
  name: rlogin / rsh / rexec
  family: remote-admin
  ports: ["512/tcp", "513/tcp", "514/tcp"]
  weight: high
  agent_expected: true
  risk: "Legacy trust-based auth (.rhosts). Cleartext. Should never be reachable."
  passive: "net:<CIDR> port:512,513,514"
  proof: {rung: E1, cmd: "nmap -Pn -p512-514 -sV <ip>", exposed_if: "Port open with an r-service banner"}
  attack: {access: [T1133, T1078.003], follow_on: [T1021]}
  soc_watch: [DET0354, DET0407]
  mitigations: [M1042, M1035]
  fix: "Disable the services and uninstall the packages."

- id: x11
  name: X11 display server
  family: remote-admin
  ports: ["6000-6005/tcp"]
  weight: high
  agent_expected: true
  risk: "An open X server allows screenshots and keystroke injection."
  passive: "net:<CIDR> port:6000"
  proof: {rung: E3, cmd: "nmap -Pn -p6000-6005 --script x11-access <ip>", exposed_if: "x11-access reports access granted"}
  attack: {access: [T1133], follow_on: [T1056.001, T1113]}
  soc_watch: [DET0354]
  mitigations: [M1042, M1035]
  fix: "Start X with -nolisten tcp and use SSH X forwarding."

# ───────────────────────────── edge / remote-access appliances ─────────────────────────────
- id: ssl-vpn
  name: SSL-VPN / remote-access gateways (Fortinet, Ivanti, Citrix, Palo Alto, Cisco, SonicWall, Check Point)
  family: edge-appliance
  ports: ["443/tcp", "10443/tcp", "4433/tcp", "8443/tcp"]
  weight: high
  agent_expected: false
  risk: "Must be public by design, so the risk is patch latency plus credential abuse. DBIR 2026: VPN is 44% of broker-sold access, and the edge/VPN share of exploitation breaches is rising sharply."
  passive: "ssl.cert.subject.cn:\"<DOMAIN>\" http.title:\"GlobalProtect\",\"FortiGate\",\"NetScaler\",\"Ivanti Connect Secure\""
  proof: {rung: E2, cmd: "nmap -Pn -p443,10443,4433,8443 -sV --script http-title,ssl-cert,http-favicon <ip>", exposed_if: "Vendor portal identified. Record product and version (from login page assets, headers, or the owner)"}
  attack: {access: [T1190, T1133, T1110.003, T1078.002], follow_on: [T1505.003, T1003.003, T1686.002]}
  soc_watch: [DET0080, DET0354, DET0487, DET0394]
  mitigations: [M1051, M1032, M1016, M1047]
  fix: "Patch within KEV SLA. Use phishing-resistant MFA. Feed device logs to the SIEM. Run integrity checks after each emergency patch. Plan migration to ZTNA."
  intel: ["CVE-2024-21762 (FortiOS SSL-VPN)", "CVE-2025-0282 (Ivanti Connect Secure)", "CVE-2023-4966 / CVE-2025-5777 (NetScaler 'Bleed')", "CVE-2024-3400 (PAN-OS GlobalProtect)", "CVE-2025-20333 (Cisco ASA/FTD)", "CVE-2024-40766 (SonicOS)"]

- id: fw-mgmt-ui
  name: Firewall / router / switch management interface
  family: edge-appliance
  ports: ["443/tcp", "8443/tcp", "4443/tcp", "80/tcp", "8080/tcp"]
  weight: critical
  agent_expected: false
  risk: "Admin plane of the perimeter itself. In scope for CISA BOD 23-02. Repeated management-plane auth-bypass KEVs."
  passive: "net:<CIDR> http.title:\"FortiGate\",\"PAN-OS\",\"SonicWall\",\"Cisco\" -port:10443"
  proof: {rung: E2, cmd: "nmap -Pn -p80,443,4443,8080,8443 --script http-title,ssl-cert <ip>", exposed_if: "Admin login page reachable from the internet (not just the VPN portal)"}
  attack: {access: [T1190, T1078.001, T1110.001], follow_on: [T1686.002, T1556.004, T1599]}
  soc_watch: [DET0080, DET0465, DET0551]
  mitigations: [M1035, M1030, M1051, M1032]
  fix: "Management on a dedicated out-of-band network or allow-listed jump host only (BOD 23-02 model). Never on the WAN interface."
  intel: ["CVE-2024-0012 (PAN-OS management auth bypass)", "CVE-2024-55591 (FortiOS management auth bypass)"]

- id: legacy-vpn
  name: Legacy VPN protocols (PPTP, IKEv1 aggressive mode)
  family: edge-appliance
  ports: ["1723/tcp", "500/udp", "4500/udp"]
  weight: medium
  agent_expected: false
  risk: "PPTP/MS-CHAPv2 is broken. IKE aggressive mode leaks a crackable PSK hash."
  passive: "net:<CIDR> port:1723,500"
  proof: {rung: E2, cmd: "nmap -Pn -sU -p500 --script ike-version <ip>; nmap -Pn -p1723 -sV <ip>", exposed_if: "IKE responds with aggressive mode, or PPTP banner present"}
  attack: {access: [T1133, T1110.002], follow_on: [T1040]}
  soc_watch: [DET0354, DET0314]
  mitigations: [M1042, M1041]
  fix: "Retire PPTP. Use IKEv2 with certificates, or a modern SSL/ZTNA client."

# ───────────────────────────── infrastructure management ─────────────────────────────
- id: ipmi
  name: IPMI over LAN (BMC)
  family: infra-management
  ports: ["623/udp"]
  weight: critical
  agent_expected: false
  risk: "BMC = hardware-level control below the OS. RAKP leaks password hashes pre-auth. Cipher 0 allows auth bypass."
  passive: "net:<CIDR> port:623"
  proof: {rung: E3, cmd: "nmap -Pn -sU -p623 --script ipmi-version,ipmi-cipher-zero <ip>", exposed_if: "IPMI responds (E2). Cipher zero enabled = E3, force P1"}
  attack: {access: [T1133, T1078.001, T1212], follow_on: [T1542, T1529]}
  soc_watch: [DET0354, DET0465, DET0174]
  mitigations: [M1035, M1030, M1042, M1027]
  fix: "BMCs belong on an isolated management VLAN only. Disable IPMI-over-LAN if unused, disable cipher 0, and rotate BMC passwords."
  intel: ["CVE-2013-4786 (RAKP hash disclosure, by design in IPMI 2.0)"]

- id: bmc-web
  name: BMC web consoles (iLO, iDRAC, XClarity, Supermicro)
  family: infra-management
  ports: ["443/tcp", "80/tcp", "5900/tcp"]
  weight: critical
  agent_expected: false
  risk: "Remote console, virtual media and power control of physical servers. Default credentials and firmware CVEs are common."
  passive: "net:<CIDR> http.title:\"iLO\",\"iDRAC\",\"XClarity\""
  proof: {rung: E2, cmd: "nmap -Pn -p80,443 --script http-title,ssl-cert <ip>", exposed_if: "BMC login page reachable"}
  attack: {access: [T1190, T1078.001], follow_on: [T1542, T1485]}
  soc_watch: [DET0080, DET0465, DET0146]
  mitigations: [M1035, M1030, M1051]
  fix: "Isolate on an OOB network behind VPN or ZTNA. Patch BMC firmware. Remove defaults."

- id: vsphere
  name: VMware vCenter / ESXi / VAMI
  family: infra-management
  ports: ["443/tcp", "902/tcp", "5480/tcp", "9443/tcp"]
  weight: critical
  agent_expected: false
  risk: "Hypervisor control plane. ESXi mass ransomware (ESXiArgs and successors) encrypts whole estates at once."
  passive: "net:<CIDR> http.title:\"vSphere\",\"VMware ESXi\""
  proof: {rung: E2, cmd: "nmap -Pn -p443,902,5480 --script vmware-version,ssl-cert <ip>", exposed_if: "vmware-version returns a product and build"}
  attack: {access: [T1190, T1078.002], follow_on: [T1059.012, T1486, T1490]}
  soc_watch: [DET0080, DET0210, DET0215]
  mitigations: [M1035, M1030, M1051, M1053]
  fix: "Never expose to the internet. Restrict to an admin jump network. Patch. Disable SLP on ESXi. Keep immutable or offline backups."
  intel: ["CVE-2021-21972 (vCenter vROPs plugin RCE)", "CVE-2021-21974 (ESXi OpenSLP, ESXiArgs)"]

- id: slp
  name: Service Location Protocol
  family: infra-management
  ports: ["427/tcp", "427/udp"]
  weight: high
  agent_expected: false
  risk: "ESXi RCE history, plus a very high-factor UDP reflection amplifier."
  passive: "net:<CIDR> port:427"
  proof: {rung: E1, cmd: "nmap -Pn -sU -sV -p427 <ip>", exposed_if: "SLP responds"}
  attack: {access: [T1190], follow_on: [T1498.002, T1486]}
  soc_watch: [DET0080, DET0408]
  mitigations: [M1042, M1037]
  fix: "Disable the SLP service (ESXi: stop slpd and close firewall rule)."
  intel: ["CVE-2023-29552 (SLP reflective DoS amplification)"]

- id: snmp
  name: SNMP v1/v2c
  family: infra-management
  ports: ["161/udp"]
  weight: high
  agent_expected: false
  risk: "Default community strings expose full device config, routing tables and ARP. Writable communities allow config changes."
  passive: "net:<CIDR> port:161"
  proof: {rung: E3, roe_gated: true, cmd: "nmap -Pn -sU -p161 --script snmp-info <ip> (E2, no community string); then, only if the RoE allows default-credential tests: nmap -Pn -sU -p161 --script snmp-sysdescr <ip>", exposed_if: "snmp-info answers = SNMP reachable (E2). snmp-sysdescr returns sysDescr using the default 'public' community = E3. Without RoE approval, stop at E2 and ask the owner"}
  attack: {access: [T1078.001], follow_on: [T1602.001, T1590.004]}
  soc_watch: [DET0465]
  mitigations: [M1042, M1035, M1041]
  fix: "Block at the edge. Migrate to SNMPv3 authPriv. Remove default and RW communities."

- id: cisco-smart-install
  name: Cisco Smart Install
  family: infra-management
  ports: ["4786/tcp"]
  weight: critical
  agent_expected: false
  risk: "Unauthenticated config download and replacement on switches. Abused by state actors."
  passive: "net:<CIDR> port:4786"
  proof: {rung: E1, cmd: "nmap -Pn -p4786 -sV <ip>", exposed_if: "Port open (the protocol has no auth, so open = vulnerable)"}
  attack: {access: [T1190], follow_on: [T1602.002, T1601]}
  soc_watch: [DET0080]
  mitigations: [M1042, M1035]
  fix: "Run 'no vstack' and block 4786 at the edge."
  intel: ["CVE-2018-0171"]

- id: hypervisor-ui
  name: Other virtualisation / HCI consoles (Proxmox, Nutanix Prism, Windows Admin Center, oVirt)
  family: infra-management
  ports: ["8006/tcp", "9440/tcp", "6516/tcp", "443/tcp"]
  weight: critical
  agent_expected: false
  risk: "Same blast radius as vCenter: one login controls every VM."
  passive: "net:<CIDR> http.title:\"Proxmox\",\"Prism\",\"Windows Admin Center\""
  proof: {rung: E2, cmd: "nmap -Pn -p8006,9440,6516,443 --script http-title,ssl-cert <ip>", exposed_if: "Console login page reachable"}
  attack: {access: [T1190, T1078.002, T1110.003], follow_on: [T1486, T1485]}
  soc_watch: [DET0080, DET0210, DET0487, DET0215]
  mitigations: [M1035, M1030, M1032]
  fix: "Admin network only, MFA, patch."

- id: nas-ui
  name: NAS / storage appliance web UI (Synology, QNAP, WD, TrueNAS)
  family: infra-management
  ports: ["5000/tcp", "5001/tcp", "8080/tcp", "443/tcp"]
  weight: high
  agent_expected: false
  risk: "Directly targeted by NAS ransomware families. Often holds the backups."
  passive: "net:<CIDR> http.title:\"Synology\",\"QNAP\",\"TrueNAS\""
  proof: {rung: E2, cmd: "nmap -Pn -p5000,5001,8080,443 --script http-title <ip>", exposed_if: "Appliance login page reachable"}
  attack: {access: [T1190, T1110.001], follow_on: [T1486, T1485]}
  soc_watch: [DET0080, DET0551, DET0215]
  mitigations: [M1035, M1051, M1053]
  fix: "Disable vendor 'quick connect' and UPnP port mapping. Reach it via VPN only. Auto-patch."

- id: backup-servers
  name: Backup infrastructure (Veeam, Commvault, Veritas, etc.)
  family: infra-management
  ports: ["9392/tcp", "9401/tcp", "9419/tcp", "443/tcp"]
  weight: critical
  agent_expected: true
  risk: "Ransomware crews go for backups first (inhibit recovery). Backup servers hold domain credentials."
  passive: "net:<CIDR> port:9392,9401"
  proof: {rung: E1, cmd: "nmap -Pn -p9392,9401,9419,443 -sV <ip>", exposed_if: "Backup service ports reachable from the internet"}
  attack: {access: [T1190], follow_on: [T1490, T1485, T1552.001]}
  soc_watch: [DET0080, DET0146, DET0307]
  mitigations: [M1035, M1030, M1051, M1053]
  fix: "Never internet-facing. Isolate the backup network. Use immutable copies and patch on the KEV timeline."
  intel: ["CVE-2024-40711 (Veeam Backup & Replication deserialisation)"]

# ───────────────────────────── file sharing & transfer ─────────────────────────────
- id: smb
  name: SMB / CIFS
  family: file-transfer
  ports: ["445/tcp", "139/tcp"]
  weight: critical
  agent_expected: true
  risk: "Wormable RCE history, NTLM relay and hash capture, share exposure. Should never cross the perimeter."
  passive: "net:<CIDR> port:445"
  proof: {rung: E2, cmd: "nmap -Pn -p445,139 --script smb-protocols,smb2-security-mode,smb-os-discovery <ip>", exposed_if: "SMB negotiation succeeds. SMBv1 enabled or signing not required = escalate"}
  attack: {access: [T1190, T1210, T1110.003], follow_on: [T1021.002, T1557.001, T1486]}
  soc_watch: [DET0080, DET0118, DET0487, DET0530, DET0462, DET0215]
  mitigations: [M1037, M1042, M1035, M1051]
  fix: "Block 445/139 inbound and outbound at the perimeter. Disable SMBv1. Require signing."
  intel: ["CVE-2017-0144 (EternalBlue)", "CVE-2020-0796 (SMBGhost)"]

- id: netbios
  name: NetBIOS name / datagram service
  family: file-transfer
  ports: ["137/udp", "138/udp"]
  weight: medium
  agent_expected: true
  risk: "Leaks hostnames, domain and logged-on users. Signals that a Windows host is directly exposed."
  passive: "net:<CIDR> port:137"
  proof: {rung: E2, cmd: "nmap -Pn -sU -p137 --script nbstat <ip>", exposed_if: "NetBIOS name table returned"}
  attack: {access: [], follow_on: [T1018, T1557.001]}
  soc_watch: [DET0462]
  mitigations: [M1037, M1042]
  fix: "Block at the perimeter. Disable NetBIOS over TCP/IP where unused."

- id: ftp
  name: FTP
  family: file-transfer
  ports: ["21/tcp"]
  weight: high
  agent_expected: true
  risk: "Cleartext credentials. Anonymous read/write is common on appliances and legacy integrations."
  passive: "net:<CIDR> port:21"
  proof: {rung: E3, cmd: "nmap -Pn -p21 -sV --script ftp-anon,ftp-syst <ip>", exposed_if: "Anonymous login allowed = E3 (record listing metadata only; never download)"}
  attack: {access: [T1078.001, T1110.001], follow_on: [T1039, T1105]}
  soc_watch: [DET0465, DET0551]
  mitigations: [M1042, M1041, M1035]
  fix: "Disable anonymous access. Migrate to SFTP or managed transfer. Restrict by source IP."

- id: tftp
  name: TFTP
  family: file-transfer
  ports: ["69/udp"]
  weight: high
  agent_expected: false
  risk: "No authentication at all. Often serves network device configs and PXE images."
  passive: "net:<CIDR> port:69"
  proof: {rung: E1, cmd: "nmap -Pn -sU -sV -p69 <ip>", exposed_if: "TFTP responds. Do not brute-force filenames"}
  attack: {access: [T1190], follow_on: [T1602.002, T1105]}
  soc_watch: [DET0080]
  mitigations: [M1042, M1035]
  fix: "Never expose. Restrict to provisioning VLANs."

- id: nfs
  name: NFS / rpcbind
  family: file-transfer
  ports: ["2049/tcp", "111/tcp", "111/udp"]
  weight: high
